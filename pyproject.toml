[tool.uv.workspace]
members = ["contracts", "brain", "realtime", "world"]

[dependency-groups]
dev = ["ruff", "pytest", "pgserver"]

[tool.pytest.ini_options]
markers = [
    "live: calls real external services; deselected unless run with -m live, skipped without credentials",
]
# A configured .env never spends API quota by accident; `-m live` on the command line wins.
addopts = ["-m", "not live"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["contracts", "brain", "realtime_worker", "world"]
