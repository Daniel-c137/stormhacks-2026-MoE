[project]
name = "moe-brain"
version = "0.0.0"
description = "Agent reasoning, agenda, memory, reports and the HTTP API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "moe-contracts",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "google-genai",
    "supabase",
    "livekit-api",
    "mcp",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "psycopg[binary]",
    "psycopg-pool",
]

[project.scripts]
brain = "brain.cli:main"

[tool.uv.sources]
moe-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
