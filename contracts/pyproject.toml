[project]
name = "moe-contracts"
version = "0.0.0"
description = "Shared request, event and data shapes for board, realtime, brain and world"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
