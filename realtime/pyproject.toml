[project]
name = "moe-realtime"
version = "0.0.0"
description = "LiveKit agent worker: live transcription, invocation detection, agent state and spoken answers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "moe-contracts",
    "livekit-agents",
    "livekit-plugins-elevenlabs",
    "pydantic-settings",
    "httpx",
]

[project.scripts]
realtime = "realtime_worker.worker:main"

[tool.uv.sources]
moe-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_worker"]
