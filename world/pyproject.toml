[project]
name = "moe-world"
version = "0.0.0"
description = "Demo world: generated GitHub/Jira snapshots, past meetings and mock MCP servers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "moe-contracts",
    "mcp",
    "pydantic-settings",
]

[project.scripts]
world-generate = "world.generator:main"
world-github-mcp = "world.github_mcp:main"
world-jira-mcp = "world.jira_mcp:main"
world-reset = "world.overlay:main"
world-seed = "world.seed:main"

[tool.uv.sources]
moe-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world"]
